name: Check and release Python distribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.11'}
          - {os: ubuntu-22.04, python: '3.13'}
          - {os: macos-15, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: make check PYTHON=python3
  package:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv sync --frozen
          make package-release DIST_DIR=dist
          uv venv /tmp/callendars-package-smoke
          uv pip install --python /tmp/callendars-package-smoke/bin/python dist/*.whl
          /tmp/callendars-package-smoke/bin/slot-sync demo --json
          /tmp/callendars-package-smoke/bin/slot-sync --version
      - uses: actions/upload-artifact@v6
        with:
          name: slot-sync-python
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: slot-sync-python
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify release metadata and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
