[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slot-sync"
version = "0.2.9"
description = "Calendar busy-time synchronization with persistent recovery and system scheduling"
requires-python = ">=3.11"
dependencies = ["google-auth[requests]>=2.40,<3"]

[project.scripts]
slot-sync = "slot_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slot_sync = ["*.toml"]
